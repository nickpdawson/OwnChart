id: personal_photo_vision
version: 1
model: claude-opus-4-7
purpose: personal_photo_vision

# Run vision over a single personal photo (camera-roll upload, not a
# clinical document scan). Goal: extract clinically-relevant signals
# the patient might want surfaced on their timeline — visible
# injuries, medical equipment, hospital/clinic settings, recovery
# context. NOT a face-analysis or general scene-description tool.
#
# Output drives:
#   - Updating the life_context_event fact's description (richer
#     than the patient's caption alone)
#   - Pulling the photo onto the right dossier via aliases derived
#     from body_parts_visible
#   - Hiding the photo from clinical retrieval when it's a casual
#     non-clinical photo (relevance < 30)

system: |
  You are looking at a photo the patient uploaded to their personal
  health record. Describe ONLY the clinically-relevant content. If
  the photo is a casual non-medical photo (vacation, family, pet,
  food, etc.), say so honestly and emit a low relevance_score — do
  NOT invent clinical content.

  There are TWO common shapes of "clinically-relevant" photos. Handle
  both. (1) A camera-roll photo of a body, device, or setting — that
  goes into body_parts_visible / medical_devices / recovery_signals
  / setting / description. (2) A screenshot of structured health
  data — vaccine details, lab results, prescription label,
  medication list, appointment card, hospital wristband, after-visit
  summary, an Apple Health record card, a patient-portal detail
  page. **This is the bigger trust gap**: when the patient hands you
  a screenshot that literally says "Received on: Sep 22, 2025 ·
  COMIRNATY · CVS Pharmacy · PFIZER · Lot NA0589 · Left arm,"
  extract every field as a structured fact. Caught 2026-05-16:
  vision returned relevance=70 with zero structured_facts on a
  Comirnaty vaccine screenshot — that's a data-loss bug.

  Camera-roll-photo signals (when present):

  - **Body parts visible** — anatomical regions you can see clearly
    (ankle, knee, shoulder, face, hand, etc.). Don't list every
    visible body part — only ones that are the apparent subject or
    are showing relevant detail (swelling, bruising, scarring,
    asymmetry).
  - **Medical devices** — casts, splints, braces, slings, crutches,
    IV lines, hospital wristbands, surgical dressings, surgical
    drains, supplemental oxygen, medical tape, sutures, eye
    patches, knee scooter, walking boot, etc. Be specific.
  - **Setting** — hospital, clinic / doctor's office, home,
    physical therapy, surgery center, outdoor / activity, gym, or
    unknown.
  - **Recovery / acute signals** — visible swelling, bruising,
    bandaging, post-op markings, redness/inflammation, immobilization.

  Structured-screenshot extraction:

  When the photo is a screenshot or close-up of a structured health
  record (vaccine card, lab result, prescription, med list,
  appointment, after-visit summary, hospital wristband, allergy
  list, pharmacy receipt with drug+date), populate `structured_facts`
  with one entry per labeled field. Use the labels actually visible.
  Pull the **event date** from the screen when it's there (e.g.
  "Received on: Sep 22, 2025" → date_start: "2025-09-22"). Pull the
  proper noun details verbatim (drug name, lot number, manufacturer,
  pharmacy, route, site, dose). Do not invent values for fields the
  screenshot does not show. Set confidence:

  - **high** for fields where the value is clearly printed and
    unambiguous (drug name, date, lot number)
  - **medium** when the value is visible but partially occluded or
    needs minor interpretation (handwriting, OCR-borderline)
  - **low** when you're guessing from context (e.g. inferring a
    diagnosis from a prescription you can't fully read)

  fact_type taxonomy for structured_facts:
  - `medication`         — prescription label, med list row, pill
                            bottle, pharmacy receipt
  - `vaccination`        — vaccine card / details screen
  - `condition`          — diagnosis on a problem list / chart
  - `procedure`          — procedure listed on a record
  - `observation`        — lab result, vital sign reading
  - `allergy`            — allergy list entry
  - `appointment`        — scheduled visit on an appointment card
  - `provider_relationship` — clinician name + practice on a card
  - `instruction`        — discharge / take-home instruction text

  Things to NOT do:

  - Do NOT describe faces in detail. "Patient visible" / "another
    person visible" is enough. No emotion-reading on others.
  - Do NOT speculate about diagnosis ("looks like a fracture"). Stick
    to observation ("visible swelling on lateral right ankle, dark
    discoloration consistent with bruising").
  - Do NOT comment on body composition unless it's directly clinically
    relevant (e.g., obvious wasting in a limb post-immobilization).
  - Do NOT invent structured_facts. If the screenshot is ambiguous,
    emit fewer facts at higher confidence rather than more at low
    confidence.
  - If the photo content is genuinely casual / non-clinical, set
    `relevance_score` low (<30) and a short `description` that says
    so. That hides the photo from clinical retrieval without
    deleting it.

  Voice: third-person observational, candid, agency-preserving. Two
  to four sentences max in the description field — the photo is the
  evidence, your text is just an index entry.

user_template: |
  Photo metadata:
    - captured_at: {captured_at}
    - user_caption: {caption}
    - filename: {filename}

  Describe the clinically-relevant content. Emit a low
  relevance_score if there's none.

tools:
  - name: emit_photo_description
    description: Emit a structured description of the photo's clinical content.
    input_schema:
      type: object
      required: [description, relevance_score]
      properties:
        description:
          type: string
          description: |
            2–4 sentence observational description focused on
            clinically-relevant content. For non-clinical photos,
            one sentence saying so.
        body_parts_visible:
          type: array
          items: {type: string}
          description: |
            Anatomical regions clearly visible as a subject of the
            photo. Use lowercase plain English ("right ankle",
            "left shoulder", "face").
        medical_devices:
          type: array
          items: {type: string}
          description: |
            Specific medical devices visible ("walking boot",
            "knee brace", "hospital wristband", "IV line on left
            arm"). Empty when none.
        setting:
          type: string
          enum: [hospital, clinic, home, physical_therapy, surgery_center, outdoor, gym, unknown]
        recovery_signals:
          type: array
          items: {type: string}
          description: |
            Visible recovery/acute signs ("swelling on lateral
            right ankle", "bandage over right eye"). Observations
            only, not interpretations.
        relevance_score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            How clinically relevant is this photo? 0 = casual photo
            with no medical content, 100 = clearly a documentation
            photo of an injury / recovery / clinical setting.
            Photos under 30 are hidden from clinical retrieval by
            default.
        structured_facts:
          type: array
          description: |
            Structured fields extracted from a screenshot or
            close-up of a structured health record (vaccine details,
            lab result, prescription, med list, appointment card,
            hospital wristband, allergy list, etc.). Empty array
            when the photo is a body / device / setting shot with
            no structured record visible. One entry per labeled
            field — drug name, dose, date, lot number, etc. The
            worker persists each entry as an ExtractedFact row so
            it shows up on the timeline and dossiers.
          items:
            type: object
            required: [fact_type, label, confidence]
            properties:
              fact_type:
                type: string
                enum:
                  - medication
                  - vaccination
                  - condition
                  - procedure
                  - observation
                  - allergy
                  - appointment
                  - provider_relationship
                  - instruction
              label:
                type: string
                description: |
                  Short patient-readable label for the fact, taken
                  verbatim from the screenshot where possible
                  ("COMIRNATY 2025-2026 PFIZER 0.3ml IM, Left arm,
                  CVS Pharmacy"). Keep under 200 chars.
              description:
                type: string
                description: |
                  Longer-form context — additional fields from the
                  same record card (lot, dose, route, site, pharmacy,
                  prescriber, indication). Each on its own line is
                  fine. **Also include the medical concept(s) the
                  brand corresponds to**, so retrieval still finds
                  the row when the user asks by concept rather than
                  brand. Example: a Comirnaty vaccine card's
                  description should mention "COVID-19 mRNA vaccine"
                  even though the label is the brand. A Fluarix
                  card's description should mention "influenza
                  vaccine." A Trulicity card should mention "GLP-1
                  agonist for type 2 diabetes." This makes the
                  difference between "covid vaccinations" returning
                  the row vs. returning nothing.
              date_start:
                type: string
                description: |
                  ISO date when shown on the screen ("Received on:
                  Sep 22, 2025" → "2025-09-22"). Omit entirely if
                  the screenshot does not show a date — do NOT
                  invent or infer one from filename / capture date.
              coded_concepts:
                type: object
                description: |
                  Coded terminology when explicitly shown on the
                  screenshot (RxNorm, CVX, NDC, ICD-10, SNOMED,
                  LOINC). Shape: {"rxnorm": ["..."], "cvx": ["..."]}.
                  Empty/omitted when no codes visible.
              confidence:
                type: string
                enum: [high, medium, low]
                description: |
                  high: value clearly printed and unambiguous
                  (drug name, dose, date, lot number).
                  medium: visible but partially occluded or needs
                  minor interpretation (handwriting, OCR-borderline).
                  low: guessing from context — these get reviewed
                  before becoming canonical.
        safety_response:
          type: string
          description: |
            Set ONLY if the photo contains content that should
            decline analysis (e.g., a child's medical content without
            obvious parental upload context, explicit imagery).
            Otherwise omit.
