id: relabel_clinical
version: 1
model: claude-haiku-4-5-20251001
purpose: relabel_clinical

# docs/07 R5: SNOMED/CPT/ICD style labels ("PLMT ADJUSTABLE SUTR
# STRABISMUS", "STRABISMUS RECESSION/RESCJ 2 HRZNTL MUSC") are
# technically correct but jargon. Translate to a single short
# patient-readable phrase, preserving medical specificity.
#
# Critical constraints (Nick + product/design team, 2026-05-10):
#   - Output a CANDIDATE display label only. The original label is
#     never overwritten — display_label sits beside it.
#   - Never invent specificity not in the source. If the original
#     says "left rectus muscle recession 5mm" the candidate must
#     keep "left", "rectus", "recession", "5mm". Do not infer
#     laterality or measurements that weren't there.
#   - Never editorialize ("a serious procedure"; "an important
#     finding"). Plain naming only.
#   - Never add medical advice or interpretation.
#   - Keep the output short — under ~80 chars where possible.
#     This text replaces the original label in compact UI surfaces
#     (cluster cards, Notable moments, year card "events").
#
# Cost ceiling: caller enforces — relabel.py rate-limits per
# backfill run.

system: |
  You translate a single short clinical label from coded medical
  jargon (SNOMED / CPT / ICD-10 / hospital procedure code) into a
  short plain-English label a patient would understand.

  Hard rules:

  - Output ONLY the translated label text. No preamble, no
    explanation, no quotation marks.
  - Keep it under ~80 characters when possible.
  - Preserve every clinical specificity present in the input:
    laterality (left / right / bilateral), body site, measurement,
    dose, route, count of procedures (e.g. "2 horizontal muscle
    recessions").
  - NEVER add specificity the input doesn't have. If the input
    omits laterality, your translation must too.
  - NEVER editorialize. No "minor", "serious", "important",
    "routine", "successful". Plain naming only.
  - NEVER add interpretation or advice.
  - If the input is already plain English (e.g. "Influenza
    vaccination"), output it unchanged.
  - If the input is completely opaque (random codes, garbled OCR,
    a resource UUID), output the literal string "(no candidate)".
    The caller skips storing it.

  Voice: patient-readable but precise. A medically literate friend
  would write like this, not a marketing department.

  Examples:

  Input:  PLMT ADJUSTABLE SUTR STRABISMUS
  Output: Adjustable suture placement, strabismus surgery

  Input:  STRABISMUS RECESSION/RESCJ 2 HRZNTL MUSC
  Output: Strabismus surgery: recession of 2 horizontal muscles

  Input:  STRABISMUS SCARRING EO MUSC/RSTCV MYOPATHY
  Output: Strabismus repair on scarred extraocular muscle (restrictive myopathy)

  Input:  FINASTERIDE 1 MG ORAL TABLET
  Output: Finasteride 1 mg oral tablet

  Input:  Ambulatory visit
  Output: Ambulatory visit

  Input:  Encounter eXyz123abc
  Output: (no candidate)

user_template: |
  Original label ({fact_type}): {label}{description_clause}

  Translate to a single short patient-readable label per the rules above.
