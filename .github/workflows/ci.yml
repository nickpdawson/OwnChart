# OwnChart CI — reproducible-build gate.
#
# Two independent jobs:
#   api-tests  — restore the exact locked deps (uv sync --frozen) and run the
#                pure-function pytest suite. The suite needs no Postgres/Redis:
#                every test is either a pure function or a FastAPI TestClient
#                with its DB/auth dependencies overridden (see
#                api/ownchart/tests/conftest.py), so no service containers are
#                declared. If a future test needs a live DB, add
#                pgvector/pgvector:pg16 + redis:7-alpine as `services:` here and
#                point OWNCHART_DATABASE_URL / OWNCHART_REDIS_URL at them.
#   web-build  — install strictly from the lockfile (npm ci) and run the
#                Next.js production build, the same steps the web Dockerfile's
#                deps+builder stages run.
#
# --frozen / npm ci both fail loudly if a lockfile is missing or out of sync
# with its manifest, which is the whole point of committing the lockfiles.
#
#   dep-audit  — blocking vulnerability audit of the *locked* dependency sets:
#                pip-audit against the exported api/uv.lock, and `npm audit`
#                against web/package-lock.json (prod deps, high+). A newly
#                disclosed CVE in a pinned dep fails the build so it can't ride
#                a release tag. To waive a specific unfixable advisory, add
#                `--ignore-vuln GHSA-xxxx-...` (pip) or bump the npm audit level.
#
# Third-party actions are pinned by commit SHA (supply-chain hardening); the
# trailing `# vX.Y.Z` comment is the human-readable tag Dependabot bumps.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Least privilege for the whole workflow; jobs may narrow further but never widen.
permissions:
  contents: read

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API — uv sync --frozen + pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run backend test suite
        run: uv run --frozen pytest -q

  web-build:
    name: Web — npm ci + next build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build (Next.js standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dep-audit:
    name: Dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # Export the fully-resolved, locked prod deps and audit exactly those
      # versions. `--no-emit-project` drops the local package itself; `--no-dev`
      # scopes to what actually ships in the image (mirrors `npm audit --omit=dev`).
      - name: Export locked API requirements
        working-directory: api
        run: uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.audit.txt

      - name: Audit Python dependencies (pip-audit)
        working-directory: api
        run: uvx pip-audit --strict --requirement requirements.audit.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Blocking on high+ advisories in the shipped (non-dev) npm tree.
      - name: Audit web dependencies (npm audit)
        run: npm --prefix web audit --omit=dev --audit-level=high
