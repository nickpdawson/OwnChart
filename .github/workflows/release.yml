# OwnChart image publish — builds and pushes the api + web images to GHCR
# on any `v*` tag push (e.g. v0.1.0-alpha, v0.2.0-beta).
#
# Images:
#   ghcr.io/nickpdawson/ownchart-api
#   ghcr.io/nickpdawson/ownchart-web
#
# Pipeline (fail-closed at every gate):
#   1. verify-ci — refuse to publish a tag whose commit has not passed the CI
#      workflow (api-tests + web-build + dep-audit) on that exact SHA. If CI
#      never ran on the tagged commit, this fails loudly. Tag only commits that
#      have already gone green on dev/main.
#   2. publish   — multi-arch (linux/amd64 + linux/arm64) build+push with an
#      SBOM and max provenance attached to the image, PLUS a signed GitHub
#      build-provenance attestation. The just-built image (by digest) is then
#      Trivy-scanned; only after the scan passes is the `latest` tag promoted
#      to that digest. A scan failure leaves `latest` on the previous release.
#
# Verifying provenance before deploy (self-hoster / levi):
#   gh attestation verify \
#     oci://ghcr.io/nickpdawson/ownchart-api@sha256:<digest> \
#     --repo nickpdawson/ownchart
#   (resolve <digest> with `docker buildx imagetools inspect ghcr.io/nickpdawson/ownchart-api:vX.Y.Z`)
#
# Auth: the built-in GITHUB_TOKEN logs in to GHCR — no PAT needed. On the first
# publish the package is created private; make it public (or grant pull) from
# the repo's Packages settings if self-hosters need anonymous pulls
# (see infra/DEPLOYMENT-production-beta.md §4b).
#
# Third-party actions are pinned by commit SHA (supply-chain hardening); the
# trailing `# vX.Y.Z` comment is the human-readable tag Dependabot bumps.

name: Release images

on:
  push:
    tags:
      - "v*"

# Least privilege at the top; each job grants only what it needs.
permissions:
  contents: read

jobs:
  # --- Gate: the tagged commit must have passed CI ------------------------------
  verify-ci:
    name: Verify CI passed for the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read CI workflow-run history for this SHA
    steps:
      - name: Require a successful CI run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Tag ${GITHUB_REF_NAME} points at commit ${SHA}"
          echo "Looking for a completed CI (ci.yml) run on that exact commit…"
          runs=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '.workflow_runs')
          total=$(echo "${runs}" | jq 'length')
          if [ "${total}" -eq 0 ]; then
            echo "::error::No completed CI run found for ${SHA}. Only tag commits that have already passed CI on dev/main."
            exit 1
          fi
          success=$(echo "${runs}" | jq '[.[] | select(.conclusion == "success")] | length')
          if [ "${success}" -eq 0 ]; then
            latest=$(echo "${runs}" | jq -r '.[0].conclusion')
            echo "::error::CI did not succeed for ${SHA} (found ${total} completed run(s), 0 successful; most recent conclusion: ${latest})."
            exit 1
          fi
          echo "CI green for ${SHA} (${success} successful run(s) of ci.yml). Proceeding to publish."

  # --- Publish: multi-arch build, SBOM/provenance/attestation, scan, promote ----
  publish:
    name: Build + push ${{ matrix.name }}
    needs: verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC token for provenance signing
      attestations: write # write the build-provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            image: ghcr.io/nickpdawson/ownchart-api
          - name: web
            context: web
            image: ghcr.io/nickpdawson/ownchart-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable version tag here; `latest` is promoted AFTER the scan
      # passes (flavor latest=false disables metadata-action's auto-latest).
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag

      - name: Build and push (multi-arch, SBOM + provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Scan the exact image we just pushed, by digest. Fail on fixable
      # CRITICAL/HIGH; unfixed advisories are ignored so a distro backlog can't
      # wedge a release. Auth via the GHCR creds set by login-action above.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Only images that passed Trivy get the moving `latest` tag.
      - name: Promote scanned image to :latest
        run: |
          docker buildx imagetools create \
            -t ${{ matrix.image }}:latest \
            ${{ matrix.image }}@${{ steps.build.outputs.digest }}
