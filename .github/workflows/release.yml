# OwnChart image publish — builds and pushes the api + web images to GHCR
# on any `v*` tag push (e.g. v0.1.0-alpha, v0.2.0-beta).
#
# Images:
#   ghcr.io/nickpdawson/ownchart-api
#   ghcr.io/nickpdawson/ownchart-web
#
# Each is tagged with the git tag AND `latest`. A self-hoster pins a release
# by using infra/docker-compose.images.yml as an override and setting
# OWNCHART_IMAGE_TAG=v0.1.0-alpha (see that file's header).
#
# Auth: the built-in GITHUB_TOKEN logs in to GHCR — no PAT needed. The job
# grants itself `packages: write`. On the first publish the package is created
# private; make it public (or grant pull) from the repo's Packages settings
# if self-hosters need anonymous pulls.

name: Release images

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build + push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            image: ghcr.io/nickpdawson/ownchart-api
          - name: web
            context: web
            image: ghcr.io/nickpdawson/ownchart-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
